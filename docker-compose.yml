services:
  llama-turboquant:
    build:
      context: https://github.com/TheTom/llama-cpp-turboquant.git#feature/turboquant-kv-cache
      dockerfile: .devops/cuda.Dockerfile
      target: server
      args:
        CUDA_VERSION: "12.8.1"
    image: local/llama-cpp-turboquant:server-cuda
    container_name: llama-turboquant
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - llama_models:/models
    command: >
      -m /models/granite4.1-30b-Q4_K_M.gguf
      --host 0.0.0.0
      --port 8080
      --ngl 38
      --n-cpu-moe 6
      --no-mmap
      --cache-type-k q8_0
      --cache-type-v turbo3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

volumes:
  llama_models:
