services:
  thinker:
    build:
      context: https://github.com/TheTom/llama-cpp-turboquant.git#feature/turboquant-kv-cache
      dockerfile: .devops/cuda.Dockerfile
      target: server
      args:
        CUDA_VERSION: "12.8.1"
    image: local/llama-cpp-turboquant:server-cuda
    container_name: thinker
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models
    command: >
      --models-preset /models/models.ini
      --host 0.0.0.0
      --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - LLAMA_ARG_HOST=0.0.0.0
